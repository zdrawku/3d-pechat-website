name: 🎬 Ново кратко видео
description: Опиши видеото с думи — агентът го прави (TikTok, YouTube Shorts, Reels). Само за екипа на сайта.
title: '[Видео]: '
labels: ['new-short']
body:
  - type: markdown
    attributes:
      value: |
        Напиши какво видео искаш и добави снимки или клипове, ако имаш. Агентът избира кадрите, записва сайта на телефонен екран, ако трябва, пише надписите, проверява ги срещу фактите за бизнеса и пуска готовото видео тук като коментар — обикновено до 15 минути. Видеото е без звук: при качване добави популярен звук от TikTok/YouTube.

        **Примери**
        - „Покажи държача за евро монети — започни с клипа как се върти.“
        - „Направи шорт, който показва как се поръчва през сайта в 3 лесни стъпки.“
        - „Разделителите за книги с драконите — подходящи за подарък за рожден ден.“

        За промени просто напиши коментар („по-кратко“, „смени надписа на втория кадър“, нов клип…) и агентът прави нова версия. Коментар, който започва с `//`, е бележка и не пуска нова версия.

        Видеата в GitHub са до 10 MB на файл (около 5 секунди от телефон). ⚠️ Работи само за екипа на сайта (`.github/issue-authors.json`).

  - type: textarea
    id: request
    attributes:
      label: Какво видео искаш?
      description: За какво е, с какво да започне, какво да покаже.
      placeholder: Направи шорт, който показва как се поръчва през сайта в 3 лесни стъпки.
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Снимки и клипове (по избор)
      description: Провлачи файловете тук. Снимките от каталога агентът добавя сам.
      placeholder: Провлачи файловете в това поле…
    validations:
      required: false
