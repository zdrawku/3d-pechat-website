# GENERATED by scripts/make-short/generate-issue-form.js from src/data/products.json
# (runs in prebuild). Edit the generator, not this file.
name: 🎬 Ново кратко видео
description: Кратко видео за TikTok, YouTube Shorts и Reels за продукт от каталога. Само за екипа на сайта.
title: '[Видео]: '
labels: ['new-short']
body:
  - type: markdown
    attributes:
      value: |
        Избери продукта и добави снимки и клипове. Ботът пише текста на видеото и го пуска тук като коментар за одобрение.
        Отговори с `/render`, за да направи видеото, или с `/redo` и бележка за нова чернова.

        Видеата в GitHub са до 10 MB на файл. По-дългите клипове качи в папката на продукта в Google Drive и отметни полето „Google Drive“.

        ⚠️ Работи само за екипа на сайта (`.github/issue-authors.json`). Issue-та от други акаунти се затварят автоматично.

  - type: dropdown
    id: product
    attributes:
      label: "Продукт"
      description: Снимките на продукта от каталога се добавят сами.
      options:
        - "Къде се срещнахме? Романтичен подарък за вашият партньор!"
        - "Вариант 1: Правоъгълна карта с българско знаме"
        - "Вариант 2: България карта с хоризонтални линии"
        - "Вариант 3: Европейски съюз Българска карта чисто синьо"
        - "Вариант 4: Персонализирани Български или правоъгълни карти"
        - "Вариант 5: Правоъгълни карти с премиум кейс"
        - "Стойка за слушалки 20 см"
        - "Стойка за слушалки 25 см"
        - "Поставка/Рамка за снимки!"
        - "Стенна рамка за снимки!"
        - "Органайзер за часовници и бижута"
        - "Разделители за книги"
        - "StandStrap — стопер за сноуборд"
        - "Държач за евро монети — фиджет спинър"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: "Снимки и клипове"
      description: Провлачи снимки и видеа тук. Видеото започва с клип, ако има такъв.
      placeholder: Провлачи файловете в това поле…
    validations:
      required: false

  - type: checkboxes
    id: drive
    attributes:
      label: "Google Drive"
      options:
        - label: "Използвай и папката на продукта в Google Drive"

  - type: textarea
    id: idea
    attributes:
      label: "Идея (по избор)"
      description: С какво да започне, какво да покаже, за кого е.
      placeholder: Започни с въртенето, после покажи монетите.
    validations:
      required: false

  - type: dropdown
    id: voice
    attributes:
      label: "Глас"
      options:
        - "Калина (женски)"
        - "Борислав (мъжки)"
        - "Без глас (само музика)"
      default: 0
    validations:
      required: true
