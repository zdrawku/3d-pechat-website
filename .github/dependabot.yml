# Version updates for the GitHub Actions the workflows use — one grouped PR a
# month. npm is left out on purpose: security fixes come from Dependabot
# security updates (Settings → Advanced Security), and Angular upgrades go
# through `ng update`, which a version-bump PR can't do.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
