name: Add Product from Issue

# "Add from phone" flow (Idea 3, Phase 3): Здравко or Мария opens a
# `📦 Нов продукт` issue with photos, this converts them and opens a PR.
#
# SECURITY — anyone can open an issue on a public repo, so the pipeline is
# fail-closed and layered:
#   1. `check-owner` gates every subsequent job on the issue author's numeric
#      GitHub id being in `.github/issue-authors.json` (ids can't be renamed
#      or re-registered the way logins can) AND on the issue coming from the
#      `📦 Нов продукт` form (scripts/check-issue-template.js) — only when it
#      is opened, so a label added to some other issue later starts nothing.
#   2. Anyone else's issue is commented on and closed without any code running.
#   3. Even for an allowed author, the result is only a PR — nothing reaches
#      the live site until it is reviewed and merged. Once it is live,
#      product-live.yml links it on the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Gate 1: decide whether this issue may drive the pipeline at all.
  check-owner:
    if: contains(github.event.issue.labels.*.name, 'new-product')
    runs-on: ubuntu-latest
    outputs:
      is_owner: ${{ steps.verify.outputs.allowed == 'true' && steps.template.outputs.template == 'true' }}
    steps:
      # Only the allowlist, the form and their checkers are needed here — no
      # dependencies, nothing from the issue is executed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/issue-authors.json
            .github/ISSUE_TEMPLATE/new-product.yml
            scripts/check-issue-author.js
            scripts/check-issue-template.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify issue author
        id: verify
        env:
          ACTOR_ID: ${{ github.event.issue.user.id }}
          ACTOR_LOGIN: ${{ github.event.issue.user.login }}
        run: node scripts/check-issue-author.js

      - name: Verify the issue comes from the 📦 Нов продукт form
        id: template
        env:
          TEMPLATE: new-product.yml
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/check-issue-template.js

  # Gate 2: politely close anything from outside the allowlist or the form. No
  # code runs here.
  reject-non-owner:
    needs: check-owner
    if: needs.check-owner.outputs.is_owner != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "Продукти добавя само екипът на сайта, през формата „📦 Нов продукт“, затова това issue се затваря автоматично. Ако искаш да предложиш продукт, пиши ни през формата за контакт на https://3dpechat.bg/contact/ 🙂"
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

  add-product:
    needs: check-owner
    if: needs.check-owner.outputs.is_owner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Add product from issue
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/add-product/from-issue.js

      - name: Validate build
        run: npm run build

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(products): add ${{ steps.add.outputs.product_name }}'
          title: '📦 Нов продукт: ${{ steps.add.outputs.product_name }}'
          body: |
            ## Нов продукт от issue #${{ github.event.issue.number }}

            **${{ steps.add.outputs.product_name }}** (`${{ steps.add.outputs.link_id }}`)

            Автоматично добавен от [issue #${{ github.event.issue.number }}](${{ github.event.issue.html_url }}):
            снимките са свалени, конвертирани в `.webp` и вписани в `src/data/products.json`.

            ### Преди мърдж провери:
            - [ ] Името и описанието са на правилен български
            - [ ] Снимките са в правилния ред (лице / гръб) и с правилна ориентация
            - [ ] Ключовите думи са смислени
            - [ ] `npm run build` мина (виж стъпката по-горе)
            - [ ] Английски текст за `/en/products/`: добави го в `src/i18n/en/content/products.json` под `${{ steps.add.outputs.link_id }}` (или по-късно — дотогава английската страница показва българския)

            Closes #${{ github.event.issue.number }}
          branch: add-product/${{ steps.add.outputs.link_id }}
          delete-branch: true
          labels: product,auto-generated

      - name: Link PR on the issue
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "Готово ✅ Отворих PR за ревю: $PR_URL"
