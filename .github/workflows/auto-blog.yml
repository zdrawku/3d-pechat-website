name: Auto Blog Post Generator

on:
  schedule:
    # Every 10 days → 3 posts per month, on the 1st, 11th and 21st at 9:00 UTC.
    # Note: `*/10` is NOT used on purpose — it would also fire on the 31st,
    # which would put two posts 10 days apart and then one after only 1 day.
    - cron: '0 9 1,11,21 * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: specific topic to write about'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    # The Claude token lives in this environment, which only `main` may use
    # (a manual run from another branch can't read it).
    environment: claude
    # Caps, so one run can't drain the Claude subscription: each of the two
    # Claude calls (article, translation) stops past an estimated spend or
    # after a time limit (scripts/auto-blog/claude.js), and the job is killed
    # after 30 minutes whatever happens.
    timeout-minutes: 30
    env:
      CLAUDE_MAX_BUDGET_USD: '1'
      CLAUDE_TIMEOUT_MIN: '10'
    steps:
      - uses: actions/checkout@v7

      # A manual run or a „Re-run“ spends the Claude subscription too: only
      # the people in .github/issue-authors.json may start one (anyone with
      # write access could otherwise). The schedule's own run needs no check.
      - name: Verify who started this run
        if: github.event_name != 'schedule' || github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.triggering_actor }}
        run: ACTOR_ID="$(gh api "users/$LOGIN" --jq .id)" ACTOR_LOGIN="$LOGIN" REQUIRE_ALLOWED=1 node scripts/check-issue-author.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Writing and translating go through Claude Code (scripts/auto-blog/claude.js).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Generate blog post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Claude Code is not set up for this repo (missing secret)."
            exit 1
          fi
          node scripts/auto-blog/index.js

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new files generated, skipping PR creation."
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(blog): add auto-generated article'
          title: '📝 Auto Blog: New article generated'
          body: |
            ## Auto-Generated Blog Post

            This PR was automatically generated by the blog automation workflow.

            It carries the Bulgarian post and, when the drafting step succeeded,
            its English version (`src/assets/blogs/en/`, `src/i18n/en/content/blog.json`,
            `translatedPosts` in `src/i18n/locales.json`). The job summary says which.

            ### Checklist before merging:
            - [ ] Review article content for accuracy (facts only from `src/data/business.json`)
            - [ ] Check Bulgarian grammar and style
            - [ ] Verify SEO metadata is appropriate
            - [ ] Ensure no duplicate/similar article exists
            - [ ] Add a real hero image (replace placeholder if needed)
            - [ ] English version: read it, check its title, description and slug (`/en/blog/<slug>/` is permanent once merged)
            - [ ] No English version? Run `npm run translate-post -- <slug>` on this branch, or merge it Bulgarian-only
          branch: auto-blog/new-post-${{ github.run_number }}
          delete-branch: true
          labels: blog,auto-generated
