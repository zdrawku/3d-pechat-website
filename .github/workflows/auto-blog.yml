name: Auto Blog Post Generator

on:
  schedule:
    # Twice a week: Monday and Thursday at 9:00 AM UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: specific topic to write about'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install script dependencies
        run: npm install --save-dev cheerio @anthropic-ai/sdk

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/auto-blog/index.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(blog): add auto-generated article'
          title: '📝 Auto Blog: New article generated'
          body: |
            ## Auto-Generated Blog Post

            This PR was automatically generated by the blog automation workflow.

            ### Checklist before merging:
            - [ ] Review article content for accuracy
            - [ ] Check Bulgarian grammar and style
            - [ ] Verify SEO metadata is appropriate
            - [ ] Ensure no duplicate/similar article exists
            - [ ] Add a real hero image (replace placeholder if needed)
          branch: auto-blog/new-post-${{ github.run_number }}
          delete-branch: true
          labels: blog,auto-generated
