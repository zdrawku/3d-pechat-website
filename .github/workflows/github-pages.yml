name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Submit EVERY sitemap URL to IndexNow (Bing) after deploying, not just new/changed ones'
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Set project name
      # This extracts the name from your package.json
      run: echo "PROJECT_NAME=$(jq -r '.name' package.json)" >> $GITHUB_ENV

    - name: Build project
      # We build with base-href "/" for custom domains
      run: npm run build -- --configuration production --base-href "/"

    - name: SPA routing handling (404 hack)
      # This is the fix. It copies index.html to 404.html
      # We use -f to force overwrite if it exists
      run: cp ./dist/${{ env.PROJECT_NAME }}/browser/index.html ./dist/${{ env.PROJECT_NAME }}/browser/404.html

    - name: Upload build artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Ensure this path matches where your index.html is
        path: ./dist/${{ env.PROJECT_NAME }}/browser

    # The live sitemap BEFORE this deploy, so IndexNow only gets URLs that are
    # new or whose <lastmod> changed. Missing (first deploy) → all URLs.
    - name: Save the live sitemap for the IndexNow diff
      run: curl -fsS https://3dpechat.bg/sitemap.xml -o "$RUNNER_TEMP/prev-sitemap.xml" || true

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # Pings Bing (and other IndexNow engines) about new/changed pages. Never
    # fails the deploy: the script always exits 0 and logs problems as warnings.
    - name: Notify IndexNow
      continue-on-error: true
      run: >
        node scripts/indexnow.js
        --sitemap ./dist/${{ env.PROJECT_NAME }}/browser/sitemap.xml
        --prev "$RUNNER_TEMP/prev-sitemap.xml"
        ${{ inputs.indexnow_all && '--all' || '' }}