name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Set project name
      # This extracts the name from your package.json
      run: echo "PROJECT_NAME=$(jq -r '.name' package.json)" >> $GITHUB_ENV

    - name: Build project
      # We build with base-href "/" for custom domains
      run: npm run build -- --configuration production --base-href "/"

    - name: SPA routing handling (404 hack)
      # This is the fix. It copies index.html to 404.html
      # We use -f to force overwrite if it exists
      run: cp ./dist/${{ env.PROJECT_NAME }}/browser/index.html ./dist/${{ env.PROJECT_NAME }}/browser/404.html

    - name: Upload build artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Ensure this path matches where your index.html is
        path: ./dist/${{ env.PROJECT_NAME }}/browser

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4