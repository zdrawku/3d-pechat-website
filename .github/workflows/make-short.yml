name: Make Short from Issue

# „🎬 Ново кратко видео“ (FEATURE-IDEAS-PLAN.md, Idea 8). Здравко or Мария
# describes a short in words, optionally with photos/clips; a Claude Code agent
# picks the shots, records
# the website on a phone screen when the request is about the site, renders
# the short and replies with it. Every later comment from the team is
# feedback and produces a new version — except a `//` note, and the
# „Качено“ + link note once the short is published, which closes the issue.
# Nothing is committed and nothing is posted to TikTok or YouTube.
#
# SECURITY — anyone can open an issue or comment on a public repo, and
# everything the agent writes ends up public:
#   1. `gate` checks the numeric GitHub id of whoever opened the issue or wrote
#      the comment against .github/issue-authors.json, and that the issue
#      comes from the `🎬 Ново кратко видео` form, before anything runs.
#   2. Strangers' issues are closed without running anything; strangers'
#      comments are ignored (and left out of the agent's input).
#   3. The agent can reach no credential: checkout keeps no token in .git,
#      credentials are scrubbed from every process it starts (and the shorts
#      tool refuses to run if one gets through), it can't read outside the
#      repo, and no MCP server starts. It may write only in its work folder
#      and run only `npm run make-short -- …`.
#   4. It may only talk about the short (.claude/skills/make-short/ci-rules.md,
#      in its system prompt), and from-issue.js enforces that on everything
#      it posts: an off-topic result.md is replaced by a neutral line, and
#      captions/upload copy that fail the same check don't render.
#   5. scripts/make-short/from-issue.js does the GitHub side before and after.

on:
  issues:
    types: [opened] # only when opened — a label added to another issue later starts nothing
  issue_comment:
    types: [created]

permissions:
  contents: write # create the shorts-drafts pre-release and upload to it
  issues: write

concurrency:
  group: make-short-${{ github.event.issue.number }}
  cancel-in-progress: false

# Caps, so no request can drain the Claude subscription. The agent stops at
# whichever comes first and the issue is told which one (from-issue.js).
# Real runs so far: at most 0.33 USD estimated, 24 steps, 85 s.
env:
  SHORTS_MODEL: sonnet
  SHORTS_MAX_BUDGET_USD: '1.5' # estimated spend per run
  SHORTS_MAX_TURNS: '50' # agent steps per run
  SHORTS_MAX_MINUTES: '15' # wall-clock per run
  SHORTS_MAX_VERSIONS: '5' # runs per issue (first version + feedback)
  SHORTS_MAX_PER_DAY: '8' # runs across all issues per 24 hours

jobs:
  gate:
    if: >-
      contains(github.event.issue.labels.*.name, 'new-short') &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (github.event_name == 'issues' ||
       (github.event.comment.user.type != 'Bot' && !startsWith(github.event.comment.body, '//')))
    runs-on: ubuntu-latest
    outputs:
      # A comment counts only when both the commenter and whoever opened the
      # issue are on the allowlist — the agent reads the issue's request too —
      # and the issue comes from the form.
      allowed: ${{ steps.verify.outputs.allowed == 'true' && (github.event_name == 'issues' || steps.verify_issue.outputs.allowed == 'true') && steps.template.outputs.template == 'true' }}
      over: ${{ steps.limits.outputs.over }}
      uploaded: ${{ steps.kind.outputs.uploaded }}
    steps:
      # Only the allowlist, the form, their checkers and the plain helpers —
      # nothing from the issue runs here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/issue-authors.json
            .github/ISSUE_TEMPLATE/new-short.yml
            scripts/check-issue-author.js
            scripts/check-issue-template.js
            scripts/make-short/limits.js
            scripts/make-short/lib.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify who is asking
        id: verify
        env:
          ACTOR_ID: ${{ github.event_name == 'issues' && github.event.issue.user.id || github.event.comment.user.id }}
          ACTOR_LOGIN: ${{ github.event_name == 'issues' && github.event.issue.user.login || github.event.comment.user.login }}
        run: node scripts/check-issue-author.js

      - name: Verify who opened the issue (for comments)
        id: verify_issue
        if: github.event_name == 'issue_comment'
        env:
          ACTOR_ID: ${{ github.event.issue.user.id }}
          ACTOR_LOGIN: ${{ github.event.issue.user.login }}
        run: node scripts/check-issue-author.js

      - name: Verify the issue comes from the 🎬 Ново кратко видео form
        id: template
        env:
          TEMPLATE: new-short.yml
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/check-issue-template.js

      # „Качено“, with or without the video link (lib.isUploadedNote): the
      # short is published, so the `published` job closes the issue instead
      # of a new version. Only the team's comments get here — whoever wrote it
      # AND whoever opened the issue passed the allowlist. The text goes in
      # through env, never into the script.
      - name: Is it the „Качено“ note?
        id: kind
        if: >-
          github.event_name == 'issue_comment' &&
          steps.verify.outputs.allowed == 'true' && steps.verify_issue.outputs.allowed == 'true' &&
          steps.template.outputs.template == 'true'
        env:
          BODY: ${{ github.event.comment.body }}
        run: node -e "console.log('uploaded=' + require('./scripts/make-short/lib').isUploadedNote(process.env.BODY))" >> "$GITHUB_OUTPUT"

      - name: Check usage limits (versions per issue, runs per day)
        id: limits
        if: >-
          steps.verify.outputs.allowed == 'true' && steps.template.outputs.template == 'true' &&
          steps.kind.outputs.uploaded != 'true' &&
          (github.event_name == 'issues' || steps.verify_issue.outputs.allowed == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/make-short/limits.js

  reject:
    needs: gate
    if: needs.gate.outputs.allowed != 'true' && github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "Кратки видеа заявява само екипът на сайта, през формата „🎬 Ново кратко видео“, затова това issue се затваря автоматично. За поръчки пиши ни през https://3dpechat.bg/contact/ 🙂"
          gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"

  # Здравко or Мария posted „Качено“ (with the video link or without): no
  # reply and no new version — a 🎉 on the comment, and the issue closes as
  # completed.
  published:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue as completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=hooray --silent
          gh issue close "$ISSUE" --repo "$REPO" --reason completed

  agent:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.over != 'true' && needs.gate.outputs.uploaded != 'true'
    # The Claude token lives in this environment, which only `main` may use —
    # a workflow pushed on any other branch can't read it.
    environment: claude
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      WORK: tmp/make-short/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # No token left in .git/config, where the agent could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remember when the run started
        run: echo "RUN_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ffmpeg renders. bubblewrap is what CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs
      # every agent command in (own PID namespace, credentials removed) —
      # without it Claude Code won't start. Ubuntu 24.04 blocks the user
      # namespace bubblewrap needs unless this sysctl is 0 (throwaway VM).
      - name: Install ffmpeg and the agent's sandbox (bubblewrap)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # The shape Claude Code uses; fails here, clearly, if it can't run.
          bwrap --new-session --die-with-parent --bind / / --dev /dev --unshare-pid --unshare-user --proc /proc -- true

      # Recording the site and drawing captions both use Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Pinned to a release at least two weeks old.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Collect the request, conversation and files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
        run: node scripts/make-short/from-issue.js prepare

      - name: Make the short (Claude Code)
        # Backstop only: `timeout` below stops the agent first.
        timeout-minutes: 20
        env:
          # The only credential in this step. Drive isn't wired into CI: its
          # key would be scrubbed from the tool anyway (FEATURE-IDEAS-PLAN.md).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Strips credentials from every process the agent starts.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Claude Code is not set up for this repo (missing secret)."
            exit 1
          fi
          # Spend, steps and time are all capped (env at the top). Hitting a cap
          # is not a failure here: `publish` reports which cap and posts
          # whatever video was finished.
          # Permissions: reads inside the repo need no rule (and nothing outside
          # it is allowed); `/…` paths are relative to the repo root.
          # `--strict-mcp-config` keeps the project's .mcp.json from starting.
          set +e
          timeout --signal=TERM "${SHORTS_MAX_MINUTES}m" \
            claude -p "/make-short CI: work folder $WORK. Start by reading $WORK/request.md, then follow the skill's „In GitHub Actions“ section and finish by writing $WORK/result.md." \
            --append-system-prompt-file .claude/skills/make-short/ci-rules.md \
            --model "$SHORTS_MODEL" \
            --max-budget-usd "$SHORTS_MAX_BUDGET_USD" \
            --max-turns "$SHORTS_MAX_TURNS" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --tools "Read,Write,Edit,Glob,Grep,Bash" \
            --allowedTools "Edit(/$WORK/**)" "Bash(npm run make-short -- *)" \
            --disallowedTools "WebFetch" "WebSearch" "Read(/.git/**)" "Read(//proc/**)" "Bash(git *)" \
            --output-format stream-json --verbose > "$RUNNER_TEMP/transcript.jsonl"
          code=$?
          echo "Claude Code exit code: $code"
          if [[ $code -eq 124 ]]; then echo "time" > "$WORK/.stopped"; exit 0; fi
          # No final result line = Claude Code never got going (setup problem):
          # fail this step, not `publish`.
          if [[ $code -ne 0 ]] && ! grep -q '"type":"result"' "$RUNNER_TEMP/transcript.jsonl"; then
            echo "::error::Claude Code didn't start (exit $code) — its error is above."
            exit 1
          fi
          exit 0

      - name: Post the result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSCRIPT: ${{ runner.temp }}/transcript.jsonl
        run: node scripts/make-short/from-issue.js publish

      - name: Tell the issue it failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/make-short/from-issue.js fail

      # Artifacts of a public repo can be downloaded by anyone signed in to
      # GitHub, and the transcript holds the whole agent session. Kept only
      # while debugging: set the repo variable SHORTS_DEBUG to true. The
      # `publish` log always has a one-line summary.
      - name: Keep the agent's transcript (debugging only)
        if: always() && vars.SHORTS_DEBUG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: make-short-transcript-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcript.jsonl
          retention-days: 3
          if-no-files-found: ignore
