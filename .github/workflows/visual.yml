name: Visual regression (Playwright)

# Visual regression runs in its own workflow because screenshot baselines are
# platform-specific — they must be generated on Linux (this runner) to match.
#
# Two modes:
#   • push/PR  → compare the built pages against committed baselines and fail on
#                unexpected visual diffs (report uploaded as an artifact).
#   • manual   → run with "update baselines" to (re)generate the Linux
#                baselines and open a PR with them (do this whenever an
#                intentional UI change lands). A PR, not a push: `main` only
#                takes reviewed changes.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate and commit screenshot baselines'
        type: boolean
        default: false

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the baselines branch (update mode)
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --- Update mode: regenerate baselines and commit them ------------------
      - name: Update baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: npm run e2e:visual:update

      # Does nothing when the baselines didn't change.
      - name: Open a PR with the updated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: e2e/__screenshots__
          branch: visual/update-baselines
          # No [skip ci]: after the merge, the visual run on main checks them.
          commit-message: 'chore(visual): update screenshot baselines'
          title: '📸 Visual: updated screenshot baselines'
          body: |
            Regenerated by the **Visual regression** workflow („update baselines“), on Linux.
            Merge it when the visual changes are the ones you intended.

      # --- Check mode: compare against committed baselines --------------------
      - name: Run visual regression
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        run: npm run e2e:visual

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 14
