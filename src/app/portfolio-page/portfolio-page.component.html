<div class="row-layout image_gallery_section_template_toys_hand_painting">
  <div class="column-layout column_layout_4">

        Продукти и проекти моделирани за 3D печат
      </h1>
      <h2 class="title_4">
        3D принтирани решения
      </h2>
    </div>
    <div class="masonry-gallery">
      @for (image of carouselImages; track image; let i = $index) {
        <div class="masonry-item">
          <img [src]="image" [alt]="'3D печат проект ' + (i + 1)" class="masonry-image" loading="lazy" />
        </div>
      }
    </div>
  </div>
</div>
