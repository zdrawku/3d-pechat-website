<button igxButton="flat" type="button" class="lang-trigger" [class.lang-trigger--open]="expanded()" #trigger
        [id]="triggerId" aria-haspopup="listbox" [attr.aria-expanded]="expanded()"
        [attr.aria-label]="'shell.language.trigger' | t: { language: current().label }"
        (click)="toggle()" (keydown)="onKeydown($event)"
        data-testid="language-switcher">
  <igx-icon class="lang-trigger__globe" aria-hidden="true">language</igx-icon>
  <span class="lang-trigger__code">{{ current().code }}</span>
  <igx-icon class="lang-trigger__caret" aria-hidden="true">{{ expanded() ? 'expand_less' : 'expand_more' }}</igx-icon>
</button>

<!-- The menu and Ignite's drop-down load on first use (prefetched when idle). -->
@defer (when requested(); prefetch on idle) {
  <app-language-menu [target]="trigger" [labelledBy]="triggerId"
                     (ready)="onMenuReady($event)" (expanded)="expanded.set($event)" />
}
