<div class="products-grid">
  <!-- Product Card for each variant -->
  @for (product of products; track product) {
    <igx-card class="product-card" [id]="product.linkId">
      <igx-card-header class="card-header">
        <h3 class="ig-typography__h5 card-title">
          <span class="product-name" [igxTooltipTarget]="tooltipRef">{{ product.name }}</span>
          <div #tooltipRef="tooltip" igxTooltip class="product-tooltip">{{ product.name }}</div>
          <button type="button" class="copy-link-btn" title="Копирай линк към секцията"
            (click)="copySectionLink(product.linkId)">
            <igx-icon family="material">link</igx-icon>
          </button>
        </h3>
      </igx-card-header>
      <!-- Image Carousel Section -->
      <div class="card-image-section">
        <div class="image-container">
          <!-- Product images with flip indicator -->
          <div class="product-image-wrapper" [class.show-back]="!product.showFront">
            <div class="product-image front-image">
              <img [src]="product.frontImage" [alt]="product.name + ' - Лице'" class="card-image"
                [class.padded-image]="product.hasImagePadding" loading="lazy" />
              </div>
              <div class="product-image back-image">
                <img [src]="product.backImage" [alt]="product.name + ' - Гръб'" class="card-image"
                  [class.padded-image]="product.hasImagePadding" loading="lazy" />
                </div>
              </div>
              <!-- Carousel Navigation Buttons -->
              <button igxIconButton="flat" class="carousel-nav prev-btn" (click)="toggleToPrevious(product, $event)"
                aria-label="Обърни картата">
                <igx-icon>chevron_left</igx-icon>
              </button>
              <button igxIconButton="flat" class="carousel-nav next-btn" (click)="toggleToNext(product, $event)"
                aria-label="Обърни картата">
                <igx-icon>chevron_right</igx-icon>
              </button>
              <!-- Side Indicator -->
              <div class="side-indicator">
                <span class="indicator-dot" [class.active]="product.showFront"></span>
                <span class="indicator-dot" [class.active]="!product.showFront"></span>
              </div>
            </div>
          </div>
          <igx-card-content class="card-content">
            <p class="ig-typography__body-1 product-description">
              {{ product.description }}
            </p>
            <!-- Custom content section (optional) -->
            @if (product.customContent?.show) {
              <div class="custom-options">
                <p class="ig-typography__body-2 custom-note">
                  {{ product.customContent.title }}
                </p>
                <ul class="custom-list">
                  @for (item of product.customContent.items; track item) {
                    <li>{{ item }}</li>
                  }
                </ul>
              </div>
            }
          </igx-card-content>
          <igx-card-actions class="card-actions">
            <button igxButton="outlined" type="button" (click)="handleAction(product)" class="contact-button">
              Поръчайте сега
            </button>
          </igx-card-actions>
        </igx-card>
      }
    </div>
