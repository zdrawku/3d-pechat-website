  <!-- Theme boot — runs synchronously in <head> BEFORE first paint so the
       correct theme class is on <html> before the body renders. Without this
       the prerendered markup paints light, then Angular's ngOnInit adds
       .dark-theme after hydration, causing a light→dark flash (FOUC). Mirrors
       the logic in AppComponent.ngOnInit so the two never disagree. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark-theme' : 'light-theme');
      } catch (e) { /* SSR / privacy mode — Angular will set it on bootstrap */ }
    })();
  </script>

  <!-- Google tag (gtag.js) with Consent Mode v2 in basic mode: nothing from
       Google loads until the visitor accepts analytics in the consent card.
       Every visitor starts with all four signals denied; grantAnalytics() (called
       by ConsentService on „Приемам“) grants analytics and loads gtag.js. A
       visitor who accepted in the last 182 days gets it after window 'load', so
       it doesn't compete for bandwidth with the first render (SI/LCP). The
       'consent' localStorage key, its format and the 182 days are shared with
       src/app/services/consent.service.ts — change them together, and keep this
       block identical in index.html and 404.html. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    window.grantAnalytics = function () {
      if (window.grantAnalytics.done) return;
      window.grantAnalytics.done = true;
      gtag('consent', 'update', { analytics_storage: 'granted' });
      gtag('js', new Date());
      gtag('config', 'G-YBR644GQL9');
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YBR644GQL9';
      document.head.appendChild(s);
    };
    try {
      var consent = JSON.parse(localStorage.getItem('consent') || 'null');
      if (consent && consent.analytics === 'granted' && Date.now() - consent.at < 182 * 864e5) {
        window.addEventListener('load', window.grantAnalytics);
      }
    } catch (e) { /* storage blocked: no answer, so no analytics */ }
  </script>
